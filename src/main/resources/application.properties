spring.application.name=attractions-local
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/attractions;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
app.refresh.enabled=true
app.refresh.initial-delay-ms=3000
app.refresh.fixed-delay-ms=300000
app.cache.ttl-minutes=10
