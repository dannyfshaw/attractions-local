<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attractions Price Finder</title>
<style>
body {
	font-family: Arial, sans-serif;
	margin: 0;
	background: #f4f6f8;
	color: #172033
}

.wrap {
	max-width: 1100px;
	margin: auto;
	padding: 32px
}

.hero {
	background: #123d6b;
	color: white;
	border-radius: 14px;
	padding: 28px
}

.controls {
	display: flex;
	gap: 12px;
	margin: 20px 0;
	flex-wrap: wrap
}

select, button {
	padding: 12px 16px;
	border-radius: 8px;
	border: 1px solid #ccd3dc;
	font-size: 16px
}

button {
	background: #1769aa;
	color: #fff;
	border: 0;
	cursor: pointer
}

.status {
	margin: 10px 0;
	color: #5b6573
}

.grid {
	display: grid;
	grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
	gap: 16px
}

.card {
	background: white;
	border-radius: 12px;
	padding: 18px;
	box-shadow: 0 2px 8px #0001
}

.price {
	font-size: 24px;
	font-weight: 700
}

.meta {
	color: #687385;
	font-size: 14px;
	margin-top: 8px
}

.badge {
	display: inline-block;
	padding: 4px 8px;
	border-radius: 12px;
	background: #e9f5ec;
	color: #18743a;
	font-size: 12px
}

.error {
	color: #a12626
}

.small {
	font-size: 13px;
	color: #687385
}
</style>
</head>
<body>
	<div class="wrap">
		<div class="hero">
			<h1>Attractions Price Finder</h1>
			<p>Standalone Spring Boot demo — cheapest available attractions
				over the next 90 days.</p>
		</div>
		<div class="controls">
			<select id="city"><option>London</option>
				<option>New York</option></select>
			<button onclick="search()">Find cheapest attractions</button>
			<button onclick="refresh()">Refresh supplier data</button>
			<button onclick="clearCache()">Clear cache</button>
		</div>
		<div id="status" class="status">Starting...</div>
		<div id="results" class="grid"></div>
		<p class="small">
			Data is simulated locally. H2 console: <a href="/h2-console"
				target="_blank">/h2-console</a>. API:
			<code>/api/v1/cities/{city}/attractions/cheapest</code>
		</p>
	</div>
	<script>
async function search(){const city=document.getElementById('city').value; status('Loading...'); try{const r=await fetch('/api/v1/cities/'+encodeURIComponent(city)+'/attractions/cheapest?limit=20'); if(!r.ok)throw new Error(await r.text()); const d=await r.json(); document.getElementById('status').textContent=`${d.attractions.length} results • ${d.validFrom} to ${d.validTo}`; document.getElementById('results').innerHTML=d.attractions.map((a,i)=>`<div class="card"><span class="badge">#${i+1}</span><h2>${a.name}</h2><div class="price">${a.minimumPrice.toFixed(2)} ${a.currency}</div><div class="meta">Lowest price: ${a.availableDate} at ${a.availableTime || ''}</div><div class="meta">Supplier: ${a.supplierId}</div></div>`).join('');}catch(e){status('Error: '+e.message,true)}}
async function refresh(){status('Refreshing supplier availability asynchronously...'); await fetch('/api/v1/admin/refresh',{method:'POST'}); setTimeout(search,1500)}
async function clearCache(){await fetch('/api/v1/admin/cache/clear',{method:'POST'}); status('Cache cleared'); search()}
function status(t,error=false){const e=document.getElementById('status');e.textContent=t;e.className='status'+(error?' error':'')}
let attempts=0; async function initialSearch(){ attempts++; await search(); if(document.getElementById('results').children.length===0 && attempts<8){setTimeout(initialSearch,2000);} } setTimeout(initialSearch,2500);
</script>
</body>
</html>
